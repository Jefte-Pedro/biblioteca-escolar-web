{% extends "biblioteca/base.html" %} {% load static %}

{% block content %}
<section class="conteudo-pag ativo">
    <div id="pag-cad-livro">

        <div class="cad-livro-header">
            <div>
                <h2 class="titulo-cadastro">Novo Livro</h2>
                <p class="descricao-cad-livro">Cadastre um livro novo no acervo. Campos com <span
                        class="obrigatorio">*</span> são obrigatórios.</p>
            </div>
        </div>

        <form id="form-cadastro-livro">
            {% csrf_token %}

            <!-- SEÇÃO 1: IDENTIFICAÇÃO -->
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <span class="cad-secao-num">1</span>
                    <h3>Identificação</h3>
                </div>
                <div class="cad-campos-grid">
                    <div class="campo campo-largo">
                        <label for="titulo">Título <span class="obrigatorio">*</span></label>
                        <input type="text" id="titulo" name="titulo" placeholder="Ex: Dom Casmurro" required>
                    </div>
                    <div class="campo">
                        <label for="autor">Autor </label>
                        <input type="text" id="autor" name="autor" placeholder="Ex: Machado de Assis" required>
                    </div>
                    <div class="campo">
                        <label for="editora">Editora</label>
                        <input type="text" id="editora" name="editora" placeholder="Ex: Ática">
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 2: CLASSIFICAÇÃO -->
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <span class="cad-secao-num">2</span>
                    <h3>Classificação</h3>
                </div>
                <div class="cad-campos-grid">
                    <div class="campo">
                        <label for="categoria">Categoria</label>
                        <input type="text" id="categoria" name="categoria" placeholder="Ex: Literatura BR">
                    </div>
                    <div class="campo">
                        <label for="colecao">Coleção</label>
                        <input type="text" id="colecao" name="colecao" placeholder="Ex: Clássicos BR">
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 3: LOCALIZAÇÃO -->
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <span class="cad-secao-num">3</span>
                    <h3>Localização</h3>
                </div>
                <div class="cad-campos-grid">
                    <div class="campo">
                        <label for="prateleira">Prateleira <span class="obrigatorio">*</span></label>
                        <input type="text" id="prateleira" name="prateleira" placeholder="Ex: G">
                    </div>
                    <div class="campo">
                        <label for="codigo_base">Código Catalográfico <span class="obrigatorio">*</span></label>
                        <input type="text" id="codigo_base" name="codigo_base" placeholder="Ex: G0042oP">
                    </div>
                    <div class="campo campo-pequeno">
                        <label for="unidades">Unidades <span class="obrigatorio">*</span></label>
                        <div class="input-contador">
                            <button type="button" id="btn-menos">−</button>
                            <input type="number" id="unidades" name="unidades" value="1" min="1" required>
                            <button type="button" id="btn-mais">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 4: OBSERVAÇÕES -->
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <span class="cad-secao-num">4</span>
                    <h3>Observações</h3>
                </div>
                <div class="campo">
                    <textarea id="observacoes" name="observacoes" rows="3"
                        placeholder="Informações adicionais sobre o livro..."></textarea>
                </div>
            </div>

            <!-- MENSAGEM DE FEEDBACK -->
            <div id="msg-cadastro" class="msg-cadastro" style="display:none;"></div>

            <div class="cad-livro-actions">
                <button type="button" class="btn-secundario" onclick="limparForm()">Limpar</button>
                <button type="submit" class="btn-confirmar-cad-livro">Cadastrar Livro</button>
            </div>

        </form>
    </div>
</section>

<script>
    // Contador de unidades
    document.getElementById('btn-menos').addEventListener('click', () => {
        const input = document.getElementById('unidades');
        if (parseInt(input.value) > 1) input.value = parseInt(input.value) - 1;
    });
    document.getElementById('btn-mais').addEventListener('click', () => {
        const input = document.getElementById('unidades');
        input.value = parseInt(input.value) + 1;
    });

    // Limpar formulário
    function limparForm() {
        document.getElementById('form-cadastro-livro').reset();
        document.getElementById('unidades').value = 1;
    }

    // Envio do formulário
    document.getElementById('form-cadastro-livro').addEventListener('submit', async function (e) {
        e.preventDefault();
        const msg = document.getElementById('msg-cadastro');

        const payload = {
            titulo: document.getElementById('titulo').value.trim(),
            autor: document.getElementById('autor').value.trim(),
            editora: document.getElementById('editora').value.trim(),
            categoria: document.getElementById('categoria').value.trim(),
            colecao: document.getElementById('colecao').value.trim(),
            prateleira: document.getElementById('prateleira').value.trim(),
            codigo_base: document.getElementById('codigo_base').value.trim(),
            quantidade: parseInt(document.getElementById('unidades').value),
            observacoes: document.getElementById('observacoes').value.trim(),
        };

        try {
            const response = await fetch('/biblioteca/cadastrar-livro/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                },
                body: JSON.stringify(payload),
            });

            const data = await response.json();

            msg.style.display = 'block';
            if (data.sucesso) {
                msg.className = 'msg-cadastro sucesso';
                msg.textContent = `✅ Livro "${payload.titulo}" cadastrado com sucesso!`;
                limparForm();
            } else {
                msg.className = 'msg-cadastro erro';
                msg.textContent = `❌ ${data.erro}`;
            }
        } catch (err) {
            msg.style.display = 'block';
            msg.className = 'msg-cadastro erro';
            msg.textContent = '❌ Erro ao cadastrar livro. Tente novamente.';
        }
    });
</script>

{% endblock %}
