{% extends "biblioteca/base.html" %} {% load static %}

{% block content %}


<section class="conteudo-pag ativo">
    <div id="pag-cad-livro">
        <h2 class="titulo-cadastro">Cadastro de Livros</h2>
        <p class="descricao-cad-livro">Adicione novos livros ao acervo da biblioteca.</p>

        <div class="container-conteudo-branco">
            <form id="form-cadastro-livro">

                <div class="campo">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" name="titulo" required>
                </div>

                <div class="campo">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" name="autor" required>
                </div>

                <div class="campo">
                    <label for="genero">Gênero:</label>
                    <input type="text" id="genero" name="genero" required>
                </div>

                <div class="campo">
                    <label for="editora">Editora:</label>
                    <input type="text" id="editora" name="editora" required>
                </div>

                <div class="campo">
                    <label for="prateleira">Prateleira:</label>
                    <input type="text" id="prateleira" name="prateleira" required>
                </div>

                <div class="campo">
                    <label for="unidades">Unidades:</label>
                    <input type="number" id="unidades" name="unidades" required>
                </div>

                <div class="campo">
                    <label for="codigo">Código Catalográfico:</label>
                    <input type="double" id="codigo" name="codigo" required>
                </div>

                <button type="submit" class="btn-confirmar-cad-livro">Cadastrar Livro</button>
            </form>


        </div>

    </div>
</section>

{% endblock %}
