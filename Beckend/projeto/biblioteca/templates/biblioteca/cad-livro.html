{% extends "biblioteca/base.html" %} {% load static %}

{% block content %}
<section class="conteudo-pag ativo">
    <div id="pag-cad-livro">

        <div class="cad-livro-header">
            <div>
                <h2 class="titulo-cadastro" data-i18n="cad_titulo"></h2>
                <p class="descricao-cad-livro" data-i18n="cad_descricao"></p>
                <p class="explorar-sub">{{ total_livros }} livro{{ total_livros|pluralize }} no acervo</p>  
            </div>
        </div>

        <form id="form-cadastro-livro">
            {% csrf_token %}

            <!-- SEÇÃO 1: IDENTIFICAÇÃO -->
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <span class="cad-secao-num">1</span>
                    <h3 data-i18n="cad_sec_identificacao"></h3>
                </div>
                <div class="cad-campos-grid">
                    <div class="campo campo-largo">
                        <label for="titulo"><span data-i18n="cad_titulo_label"></span> <span
                                class="obrigatorio">*</span></label>
                        <input type="text" id="titulo" name="titulo" data-i18n-placeholder="cad_titulo_placeholder"
                            required>
                    </div>
                    <div class="campo">
                        <label for="autor" data-i18n="cad_autor_label"></label>
                        <input type="text" id="autor" name="autor" data-i18n-placeholder="cad_autor_placeholder">
                    </div>
                    <div class="campo">
                        <label for="editora" data-i18n="cad_editora_label"></label>
                        <input type="text" id="editora" name="editora" data-i18n-placeholder="cad_editora_placeholder">
                    </div>
                    <div class="campo">
                        <label for="isbn" data-i18n="cad_isbn_label"></label>
                        <input type="text" id="isbn" name="isbn" data-i18n-placeholder="cad_isbn_placeholder"
                            maxlength="17">
                    </div>
                    <div class="campo campo-largo">
                        <label for="capa_url" data-i18n="cad_capa_url_label"></label>
                        <input type="url" id="capa_url" name="capa_url"
                            data-i18n-placeholder="cad_capa_url_placeholder">
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 2: CLASSIFICAÇÃO -->
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <span class="cad-secao-num">2</span>
                    <h3 data-i18n="cad_sec_classificacao"></h3>
                </div>
                <div class="cad-campos-grid">
                    <div class="campo">
                        <label for="categoria" data-i18n="cad_categoria_label"></label>
                        <input type="text" id="categoria" name="categoria"
                            data-i18n-placeholder="cad_categoria_placeholder">
                    </div>
                    <div class="campo">
                        <label for="colecao" data-i18n="cad_colecao_label"></label>
                        <input type="text" id="colecao" name="colecao" data-i18n-placeholder="cad_colecao_placeholder">
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 3: LOCALIZAÇÃO -->
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <span class="cad-secao-num">3</span>
                    <h3 data-i18n="cad_sec_localizacao"></h3>
                </div>
                <div class="cad-campos-grid">
                    <div class="campo">
                        <label for="prateleira"><span data-i18n="cad_prateleira_label"></span> <span
                                class="obrigatorio">*</span></label>
                        <input type="text" id="prateleira" name="prateleira"
                            data-i18n-placeholder="cad_prateleira_placeholder">
                    </div>
                    <div class="campo">
                        <label for="codigo_base"><span data-i18n="cad_codigo_base_label"></span> <span
                                class="obrigatorio">*</span></label>
                        <input type="text" id="codigo_base" name="codigo_base"
                            data-i18n-placeholder="cad_codigo_base_placeholder">
                    </div>
                    <div class="campo campo-pequeno">
                        <label for="unidades"><span data-i18n="cad_unidades_label"></span> <span
                                class="obrigatorio">*</span></label>
                        <div class="input-contador">
                            <button type="button" id="btn-menos">−</button>
                            <input type="number" id="unidades" name="unidades" value="1" min="1" required>
                            <button type="button" id="btn-mais">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 4: OBSERVAÇÕES -->
            <div class="cad-secao">
                <div class="cad-secao-titulo">
                    <span class="cad-secao-num">4</span>
                    <h3 data-i18n="cad_sec_observacoes"></h3>
                </div>
                <div class="campo">
                    <textarea id="observacoes" name="observacoes" rows="3"
                        data-i18n-placeholder="cad_observacoes_placeholder"></textarea>
                </div>
            </div>

            <!-- MENSAGEM DE FEEDBACK -->
            <div id="msg-cadastro" class="msg-cadastro" style="display:none;"></div>

            <div class="cad-livro-actions">
                <button type="button" class="btn-secundario" onclick="limparForm()" data-i18n="cad_btn_limpar"></button>
                <button type="submit" class="btn-confirmar-cad-livro" data-i18n="cad_btn_cadastrar"></button>
            </div>

        </form>
    </div>
</section>

<script>
    // Contador de unidades
    document.getElementById('btn-menos').addEventListener('click', () => {
        const input = document.getElementById('unidades');
        if (parseInt(input.value) > 1) input.value = parseInt(input.value) - 1;
    });
    document.getElementById('btn-mais').addEventListener('click', () => {
        const input = document.getElementById('unidades');
        input.value = parseInt(input.value) + 1;
    });

    // Limpar formulário
    function limparForm() {
        document.getElementById('form-cadastro-livro').reset();
        document.getElementById('unidades').value = 1;
        document.getElementById('msg-cadastro').style.display = 'none';
    }

    // Envio do formulário
    document.getElementById('form-cadastro-livro').addEventListener('submit', async function (e) {
        e.preventDefault();
        const msg = document.getElementById('msg-cadastro');

        const payload = {
            titulo: document.getElementById('titulo').value.trim(),
            autor: document.getElementById('autor').value.trim(),
            editora: document.getElementById('editora').value.trim(),
            isbn: document.getElementById('isbn').value.trim(),
            capa_url: document.getElementById('capa_url').value.trim(),
            categoria: document.getElementById('categoria').value.trim(),
            colecao: document.getElementById('colecao').value.trim(),
            prateleira: document.getElementById('prateleira').value.trim(),
            codigo_base: document.getElementById('codigo_base').value.trim(),
            quantidade: parseInt(document.getElementById('unidades').value),
            observacoes: document.getElementById('observacoes').value.trim(),
        };

        try {
            const response = await fetch('/biblioteca/cadastrar-livro/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                },
                body: JSON.stringify(payload),
            });

            const data = await response.json();

            msg.style.display = 'block';
            if (data.sucesso) {
                msg.className = 'msg-cadastro sucesso';
                msg.textContent = `✅ ${payload.titulo}`;
                limparForm();
                msg.style.display = 'block';
            } else {
                msg.className = 'msg-cadastro erro';
                msg.textContent = `❌ ${data.erro}`;
            }
        } catch (err) {
            msg.style.display = 'block';
            msg.className = 'msg-cadastro erro';
            msg.textContent = '❌';
        }
    });
</script>

{% endblock %}
