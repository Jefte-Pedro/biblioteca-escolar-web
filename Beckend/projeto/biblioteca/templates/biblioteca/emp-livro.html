{% extends "biblioteca/base.html" %}
{% load static %}

{% block content %}

<section class="conteudo-pag ativo">
    <div id="pag-cad-livro">
        <h2 class="titulo-cadastro">Empréstimos de Livros</h2>
        <p class="descricao-cad-livro">Acompanhe todos os livros emprestados no momento.</p>

        <div class="container-conteudo-branco">
            <table class="tabela-emprestimos">
                <thead>
                    <tr>
                        <th>Título do Livro</th>
                        <th>Nome do Leitor</th>
                        <th>Data de Empréstimo</th>
                        <th>Data de Devolução</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Exemplo de linha de empréstimo -->
                    <tr>
                        <td>O Senhor dos Anéis</td>
                        <td>João Silva</td>
                        <td>01/06/2024</td>
                        <td>15/06/2024</td>
                    </tr>
                    <!-- Adicione mais linhas conforme necessário -->
                </tbody>
            </table>

        </div>

    </div>
</section>


{% endblock %}
